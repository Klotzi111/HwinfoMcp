version: 2
updates:
  # Keeps the SHA-pinned actions in the workflows up to date, including their version comments
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  # Directory.Packages.props
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
