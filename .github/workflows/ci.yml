name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

# A newer push supersedes a running build of the same branch or pull request; releases always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TESTINGPLATFORM_TELEMETRY_OPTOUT: true

# The actions are pinned to commits; Dependabot (.github/dependabot.yml) keeps them and the comments up to date.
jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      msbuild-args: ${{ steps.version.outputs.msbuild-args }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Determine version
        id: version
        shell: pwsh
        run: |
          # A tag v1.2.3 builds version 1.2.3, every other build the project's version with a CI suffix
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $semVer = '^v((0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?)$'
            if ($env:GITHUB_REF_NAME -match $semVer) {
              $version = $Matches[1]
            } else {
              throw "Tag $env:GITHUB_REF_NAME is no version like v1.2.3 or v1.2.3-beta.1"
            }
            # The project's version must match, so local builds (install-local.ps1) report the same version
            $prefix = (Select-Xml -Path HwinfoMcp/HwinfoMcp.csproj -XPath '/Project/PropertyGroup/VersionPrefix').Node.InnerText.Trim()
            if ($version.Split('-')[0] -ne $prefix) {
              throw "Tag $env:GITHUB_REF_NAME doesn't match <VersionPrefix>$prefix</VersionPrefix> in HwinfoMcp/HwinfoMcp.csproj"
            }
            "msbuild-args=-p:Version=$version" >> $env:GITHUB_OUTPUT
            "prerelease=$($version.Contains('-').ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          } else {
            "msbuild-args=-p:VersionSuffix=ci.$env:GITHUB_RUN_NUMBER" >> $env:GITHUB_OUTPUT
            "prerelease=false" >> $env:GITHUB_OUTPUT
          }

  build:
    name: Build, test and pack
    needs: version
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      VERSION_ARGS: ${{ needs.version.outputs.msbuild-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore HwinfoMcp.slnx

      # CI=true turns warnings into errors (Directory.Build.props)
      - name: Build
        run: dotnet build HwinfoMcp.slnx --configuration Release --no-restore $env:VERSION_ARGS

      - name: Test
        run: dotnet test --solution HwinfoMcp.slnx --configuration Release --no-build

      # Keeps the tool package buildable for nuget.org later (TODOs.md). It is a build artifact only, not released.
      - name: Pack (dotnet tool)
        run: dotnet pack HwinfoMcp/HwinfoMcp.csproj --configuration Release --no-build $env:VERSION_ARGS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HwinfoMcp-nupkg
          path: artifacts/nupkg/*.nupkg
          if-no-files-found: error
          retention-days: 7

  native:
    name: Native AOT (${{ matrix.rid }})
    needs: version
    # Native AOT links with MSVC, which the Windows images bring along. Each executable is built on a runner of its
    # architecture, so the tests below can run it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            runner: windows-latest
          - rid: win-arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      VERSION_ARGS: ${{ needs.version.outputs.msbuild-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The tests run against the executable below, but are built as usual
      - name: Build
        run: dotnet build HwinfoMcp.slnx --configuration Release $env:VERSION_ARGS

      - name: Publish
        run: dotnet publish HwinfoMcp/HwinfoMcp.csproj -p:PublishProfile=${{ matrix.rid }} $env:VERSION_ARGS

      - name: Check the executable
        shell: pwsh
        run: |
          $files = @(Get-ChildItem artifacts/publish/${{ matrix.rid }})
          if ($files.Count -ne 1 -or $files[0].Name -ne 'HwinfoMcp.exe') {
            throw "Expected only HwinfoMcp.exe, found: $($files.Name -join ', ')"
          }

      # StdioServerTests starts the executable HWINFOMCP_EXE points to and talks MCP to it over stdio
      - name: Test the executable
        env:
          HWINFOMCP_EXE: ${{ github.workspace }}/artifacts/publish/${{ matrix.rid }}/HwinfoMcp.exe
        run: dotnet test --solution HwinfoMcp.slnx --configuration Release --no-build --filter-class HwinfoMcp.Tests.StdioServerTests

      - name: Name the executable after its platform
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/release | Out-Null
          Copy-Item artifacts/publish/${{ matrix.rid }}/HwinfoMcp.exe artifacts/release/HwinfoMcp-${{ matrix.rid }}.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: HwinfoMcp-${{ matrix.rid }}
          path: artifacts/release/HwinfoMcp-${{ matrix.rid }}.exe
          if-no-files-found: error
          retention-days: ${{ github.ref_type == 'tag' && 90 || 7 }}

  release:
    name: Release
    needs: [version, build, native]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestations
      attestations: write  # store the attestations
    steps:
      # Only the native executables; the tool package stays a build artifact until it goes to nuget.org (TODOs.md)
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: HwinfoMcp-win-*
          merge-multiple: true
          path: release

      - name: Checksums
        working-directory: release
        run: |
          sha256sum -- *.exe > SHA256SUMS
          cat SHA256SUMS

      # Attestations are only available for public repositories (or with GitHub Enterprise Cloud)
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: release/*.exe

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          flags=(--repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag)
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" release/* "${flags[@]}"
